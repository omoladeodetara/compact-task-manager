name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, configuration, and placement tests
        shell: powershell
        run: .\tests\Test.ps1
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sampling dependency
        run: python -m pip install -r requirements-portable.txt
      - name: Portable lifecycle, startup serialization, diagnostics, and real metrics
        run: python -m unittest discover -s tests -p "test_portable.py" -v
      - name: Install Linux display test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Real Linux GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.smoke_portable
